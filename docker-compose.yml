services:
  db:
    image: postgres:16
    container_name: postgres_theater
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog_theater
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-theater
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000" # S3 API
      - "9001:9001"                # Console
    volumes:
      - minio_data:/data

  # Initializes MinIO bucket(s) for local development
  minio_mc:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-mc-theater
    depends_on:
      - minio
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set theater http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p theater/${MINIO_STORAGE} || true &&
      tail -f /dev/null
      "

  web:
    build: .
    container_name: api_theater
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      - db
      - mailhog
      - minio
    command: >
      sh -c "poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000"

  # One-off service for applying Alembic migrations:
  # Run manually (does not start on `up`):
  # docker compose --profile migrate run --rm migrator
  migrator:
    build: .
    container_name: migrator_theater
    profiles: [ "migrate" ]
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./proj.db:/app/proj.db
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    command: [ "poetry", "run", "alembic", "upgrade", "head" ]
    restart: "no"

  # Optional async stack (enable only after Celery integration):
  # docker compose --profile async up -d
  additional_db:
    image: redis:7
    container_name: redis_theater
    profiles: ["async"]
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: celery_theater
    profiles: ["async"]
    env_file: .env
    depends_on:
      - additional_db
      - db
    command: ["sh", "-c", "echo 'Celery not configured yet' && sleep infinity"]

  celery-beat:
    build: .
    container_name: celery_beat_theater
    profiles: ["async"]
    env_file: .env
    depends_on:
      - additional_db
    command: ["sh", "-c", "echo 'Celery beat not configured yet' && sleep infinity"]

volumes:
  postgres_data:
  minio_data:
