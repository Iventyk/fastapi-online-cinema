name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run black
        run: poetry run black --check .

      - name: Run flake8
        run: poetry run flake8

      - name: Type checking
        run: |
          poetry run mypy .

  test:
    needs: lint-and-type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for services (Optional but recommended)
        run: sleep 10

      - name: Run tests inside container
        run: |
          docker compose exec -T web poetry run pytest --cov=src

      - name: Shutdown services
        if: always()
        run: docker compose down