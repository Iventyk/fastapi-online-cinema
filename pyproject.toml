[tool.poetry]
name = "fastapi-online-cinema"
version = "0.1.0"
description = "Online cinema backend API"
authors = ["Ivan Ventyk <ivanventik@gmail.com>"]
license = "MIT"

packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
sqlalchemy = "^2.0.46"
pydantic-settings = "^2.12.0"
alembic = "^1.18.3"
pytest-asyncio = "^1.3.0"
pytest = "^9.0.2"
mypy = "^1.19.1"
flake8 = "^7.3.0"
black = "^26.1.0"
pytest-cov = "^7.0.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
bcrypt = "^5.0.0"
aiosqlite = "^0.22.1"
pydantic = {extras = ["email"], version = "^2.12.5"}
python-multipart = "^0.0.22"
aioboto3 = "^15.5.0"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.11"
aiosmtplib = "^5.1.0"
jinja2 = "^3.1.6"
celery = "^5.6.2"
redis = "^7.1.0"
slowapi = "^0.1.9"
stripe = "^14.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = 3.13
ignore_missing_imports = true
strict = true
exclude = '''
/(
  | migrations
  | venv
  | .venv
  | __pycache__
)/
'''

[tool.black]
line-length = 79
target-version = ["py313"]
exclude = '''
/(
    migrations
  | venv
  | .venv
  | __pycache__
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["src/tests"]

[dependency-groups]
dev = [
    "pytest-mock (>=3.15.1,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
