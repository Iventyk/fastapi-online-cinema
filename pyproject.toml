[tool.poetry]
package-mode = false
name = "fastapi-online-cinema"
version = "0.1.0"
description = "Online cinema backend API"
authors = ["Ivan Ventyk <ivanventik@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
sqlalchemy = "^2.0.46"
pydantic-settings = "^2.12.0"
alembic = "^1.18.3"
pytest-asyncio = "^1.3.0"
pytest = "^9.0.2"
mypy = "^1.19.1"
flake8 = "^7.3.0"
black = "^26.1.0"
aiosqlite = "^0.22.1"
pydantic = {extras = ["email"], version = "^2.12.5"}
bcrypt = "^5.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = 3.13
ignore_missing_imports = true
strict = true

[tool.black]
line-length = 79
target-version = ["py313"]
exclude = '''
/(
    migrations
  | venv
  | .venv
  | __pycache__
)/
'''
